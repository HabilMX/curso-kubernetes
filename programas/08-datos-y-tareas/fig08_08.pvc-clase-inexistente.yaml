# fig08_08.pvc-clase-inexistente.yaml — Lección 8, Ejercicio 1: una solicitud de volumen que
# pide la clase «rapido», que este clúster no tiene, y un Pod que la usa.
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: rapido
  namespace: revisor
spec:
  accessModes: [ReadWriteOnce]
  storageClassName: rapido
  resources:
    requests:
      storage: 100Mi
---
apiVersion: v1
kind: Pod
metadata:
  name: lector
  namespace: revisor
  labels:
    app: lector
spec:
  restartPolicy: Never
  automountServiceAccountToken: false
  securityContext:
    runAsNonRoot: true
    runAsUser: 100
    runAsGroup: 101
    fsGroup: 101
    seccompProfile:
      type: RuntimeDefault
  containers:
  - name: lector
    image: curlimages/curl:8.22.0@sha256:58adaa4e8dca9c988bae2aba4ab3434a0bb2da16bbe3f92dec39ec7785166777
    command: ["ls", "-ln", "/datos"]
    resources:
      requests: {cpu: 10m, memory: 16Mi}
      limits: {cpu: 100m, memory: 32Mi}
    volumeMounts:
    - name: datos
      mountPath: /datos
    securityContext:
      allowPrivilegeEscalation: false
      readOnlyRootFilesystem: true
      capabilities:
        drop: ["ALL"]
  volumes:
  - name: datos
    persistentVolumeClaim:
      claimName: rapido
