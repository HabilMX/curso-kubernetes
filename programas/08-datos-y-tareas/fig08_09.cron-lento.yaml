# fig08_09.cron-lento.yaml — Lección 8, Ejercicio 3: un CronJob cada minuto cuya tarea tarda
# 100 segundos, con concurrencyPolicy: Forbid. ¿Qué hace el CronJob cuando llega el
# siguiente minuto y la tarea anterior sigue corriendo?
apiVersion: batch/v1
kind: CronJob
metadata:
  name: lento
  namespace: revisor
spec:
  schedule: "* * * * *"
  concurrencyPolicy: Forbid
  successfulJobsHistoryLimit: 1
  failedJobsHistoryLimit: 1
  jobTemplate:
    spec:
      backoffLimit: 0
      activeDeadlineSeconds: 150
      template:
        metadata:
          labels:
            app: lento
        spec:
          automountServiceAccountToken: false
          restartPolicy: Never
          securityContext:
            runAsNonRoot: true
            runAsUser: 100
            runAsGroup: 101
            seccompProfile:
              type: RuntimeDefault
          containers:
          - name: lento
            image: curlimages/curl:8.22.0@sha256:58adaa4e8dca9c988bae2aba4ab3434a0bb2da16bbe3f92dec39ec7785166777
            command: ["sh", "-c", "date -u +%T; sleep 100; date -u +%T"]
            resources:
              requests: {cpu: 10m, memory: 16Mi}
              limits: {cpu: 100m, memory: 32Mi}
            securityContext:
              allowPrivilegeEscalation: false
              readOnlyRootFilesystem: true
              capabilities:
                drop: ["ALL"]
